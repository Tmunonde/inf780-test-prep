<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

.mt tr.wrong td:last-child select{border-color:var(--bad);background:var(--bad-bg)}

.ctx{background:var(--soft);border-left:3px solid var(--line);padding:10px 14px;margin-top:10px;font-size:.93rem}
textarea{width:100%;min-height:150px;font:inherit;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);margin-top:10px;resize:vertical}
.wc{font:500 .75rem var(--mono);color:var(--muted);text-align:right}
.fb{margin-top:12px;padding:12px 14px;border-radius:5px;background:var(--soft);font-size:.93rem}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb b.v{display:block;margin-bottom:2px}
.fb.good b.v{color:var(--good)} .fb.bad b.v{color:var(--bad)}
.model{white-space:pre-wrap;font-size:.92rem;background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:5px;margin-top:8px}
.check{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--good)}
.sug{font:500 .7rem var(--mono);color:var(--warn);margin-left:4px}
.selfmark{font:700 .9rem var(--mono);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px 28px;align-items:center}
.big{font:800 clamp(2.6rem,9vw,4.2rem) var(--display);line-height:1;letter-spacing:-.03em}
.big small{font-size:.4em;color:var(--muted)}
.tbars{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.tb{display:grid;grid-template-columns:minmax(0,11rem) 1fr 4.5rem;gap:10px;align-items:center;font-size:.9rem}
.tb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.tb .tr i{display:block;height:100%}
.tb .n{font:500 .8rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.crib{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.crib section{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--paper);min-width:0}
.crib h3{font-size:.95rem;margin-bottom:6px}
.crib ul{margin:0;padding-left:1.1em;font-size:.88rem}
.crib li{margin-bottom:3px}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.confirm{border:2px solid var(--ink);border-radius:6px;padding:14px;background:var(--soft);margin-top:14px}
.scroll{overflow-x:auto}
@media (max-width:560px){
  .q{grid-template-columns:2rem 1fr auto}
  .score{grid-template-columns:1fr}

}

<script>
const TOPICS={process:"Research process",strategy:"Research strategy",collection:"Data collection",analysis:"Data analysis",slr:"SLR",thematic:"Thematic analysis",problem:"Problem statement",rq:"Research questions",abstract:"Abstract",conclusion:"Conclusion & discussion",citations:"Citations",synthesis:"Synthesised writing"};

/* ---------- QUESTION BANK ---------- */
const MCQ=[
{t:"process",q:"Oates describes research in terms of the “6Ps”. Which of these is NOT one of them?",o:["Population","Purpose","Paradigm","Presentation"],a:0,e:"The 6Ps are purpose, products, process, participants, paradigm and presentation (Oates)."},
{t:"process",q:"In Oates’ 6Ps, the “products” of research are best described as:",o:["The outcomes, especially your contribution to knowledge (and possibly an IT artefact)","The software tools used to analyse data","The sequence of activities from topic to conclusion","The journals you publish in"],a:0,e:"Products = outcomes, especially the contribution to knowledge. The sequence of activities is the process."},
{t:"process",q:"In the simplified research process from class, “Determining the sample design” answers which question?",o:["How much can we do?","What is the problem?","How can we investigate the problem?","Does it fit with the world?"],a:0,e:"Research design = how can we investigate; sample design = how much can we do; generalisation = does it fit with the world."},
{t:"process",q:"Oates’ conceptual framework makes explicit:",o:["How you structure your thinking about the topic and the process you will follow","The final list of references","The ethical clearance number","Only the statistical tests used"],a:0,e:"It covers the factors in your topic, the theory/lens, your strategy and methods, your analysis approach and how you will evaluate the research."},
{t:"process",q:"Your view of what valid knowledge is and how it can be obtained is your:",o:["Epistemology","Ontology","Axiology","Methodology"],a:0,e:"Ontology = nature of reality (realist vs relativist). Epistemology = valid knowledge (objective vs subjective). Axiology = your influence/values (relevance vs rigour)."},
{t:"process",q:"Which characteristic belongs to interpretivism rather than positivism?",o:["Multiple subjective realities and researcher reflexivity","Hypothesis testing and universal laws","An objective, neutral researcher","A world that exists independently of humans and can be measured"],a:0,e:"Interpretivism: multiple subjective realities, socially constructed meaning, reflexivity. The others are positivist characteristics."},
{t:"process",q:"Lincoln and Guba’s interpretivist equivalent of “external validity” is:",o:["Transferability","Credibility","Dependability","Confirmability"],a:0,e:"Objectivity→confirmability, reliability→dependability, internal validity→credibility, external validity→transferability."},
{t:"process",q:"Oates warns that calling positivism “quantitative research” and interpretivism “qualitative research” is:",o:["Inaccurate: paradigms are distinguished by ontology and epistemology, and either data type can appear in any paradigm","Correct, because each paradigm uses only one data type","Correct only for surveys","Only a problem in design and creation research"],a:0,e:"Quantitative data tends to dominate positivism, but the paradigm is defined by its assumptions, not the data type."},
{t:"strategy",q:"Which strategy investigates cause-and-effect, tests hypotheses and uses before/after measurement while controlling other factors?",o:["Experiment","Survey","Case study","Ethnography"],a:0,e:"Experiments manipulate an independent variable and control confounding variables."},
{t:"strategy",q:"A collaborative, cyclical process of plan → act → observe → reflect, aimed at solving a practical problem while generating knowledge, is:",o:["Action research","Design and creation","Ethnography","Survey"],a:0,e:"Action research is participatory and iterative, integrating theory with practice."},
{t:"strategy",q:"A student builds and iteratively evaluates a prototype app to address a gap in practice. The strategy is:",o:["Design and creation","Case study","Experiment","Action research"],a:0,e:"Design and creation develops new IT artefacts (systems, models, methods) through design → build → evaluate → redesign."},
{t:"strategy",q:"Long-term immersion, participant observation, field notes and “thick description” are features of:",o:["Ethnography","Survey","Experiment","Design and creation"],a:0,e:"Ethnography studies cultures and practices from the inside over time."},
{t:"strategy",q:"Which strategy obtains the same kinds of data from a large group in a standardised way so findings can be generalised?",o:["Survey","Case study","Action research","Ethnography"],a:0,e:"Surveys look for patterns, often with statistics, to generalise to a wider population."},
{t:"strategy",q:"A case study that tests an existing theory in a real-world context is:",o:["Explanatory","Exploratory","Descriptive","Multiple-case"],a:0,e:"Exploratory = identifies new phenomena; explanatory = tests theories in context; descriptive = detailed account."},
{t:"strategy",q:"Deductive reasoning, where a theoretical framework guides hypotheses that are then tested on a sample, is most often associated with:",o:["Positivism","Interpretivism","Critical research","Ethnography"],a:0,e:"Deductive → positivism (measure). Inductive (patterns → concepts → theory) → interpretivism (understand)."},
{t:"strategy",q:"In the role of theory, a theory such as TAM acts as a “lens”. This means it:",o:["Determines what you will see and look for in the data","Guarantees your findings are correct","Replaces the need for a literature review","Can only be used in experiments"],a:0,e:"Theory frames questions, guides method and shapes interpretation. The risk is being blinded to things outside it."},
{t:"collection",q:"The Hawthorne effect is a key concern when evaluating which data generation method?",o:["Observation","Document analysis","Questionnaires","Systematic searching"],a:0,e:"People change behaviour when they know they are being observed."},
{t:"collection",q:"“How satisfied are you with the speed and accuracy of the system?” What is wrong with this question?",o:["It is double-barrelled (asks two things at once)","It asks for second-hand information","It is a hypothetical question","Nothing, it is well written"],a:0,e:"Each question should ask for only one piece of information."},
{t:"collection",q:"According to the instrument-design slides, demographic questions should usually be placed:",o:["Not at the beginning; first questions should be relevant and easy","Always first, to warm respondents up","In the middle, to break up the survey","On a separate form"],a:0,e:"Start with salient, easy questions. Put potentially objectionable questions near the end."},
{t:"collection",q:"A major advantage of the “think-aloud” cognitive interview is:",o:["Minimal interviewer bias and unanticipated answers","Very little time needed","Easy coding","Low burden on the respondent"],a:0,e:"Disadvantages are poor economy of time, unnaturalness, burden on the subject and burdensome coding."},
{t:"collection",q:"A small-scale study simulating all conditions of the full-scale survey is a:",o:["Field pre-test","Focus group","Behaviour coding exercise","Cognitive interview"],a:0,e:"Warning signs include skewed distributions, low response rates and high “don’t know” rates."},
{t:"collection",q:"Field notes, photographs and diagrams produced during your study are:",o:["Researcher-generated documents","Found documents","Secondary data","Grey literature"],a:0,e:"Found documents already exist (strategies, minutes, manuals). Researcher-generated ones are created for the research."},
{t:"collection",q:"To reach expert programmers you interview one and ask them to recommend others. This is:",o:["Snowball sampling","Random sampling","Stratified sampling","Cluster sampling"],a:0,e:"Snowball and purposive sampling are typical for interviews; random, stratified and cluster for surveys."},
{t:"collection",q:"Which is a way to INCREASE perceived reward for completing a survey?",o:["Say thank you and ask for their “advice”","Ask lots of personal questions early","Use subordinating language","Send the invitation months in advance"],a:0,e:"Rewards: positive regard, thanks, asking advice, social validation, tangible reward, interest, a deadline."},
{t:"analysis",q:"A survey codes home language as 1 = isiZulu, 2 = Tshivenda, 3 = English. This is:",o:["Nominal data","Ordinal data","Interval data","Ratio data"],a:0,e:"Nominal numbers are labels for categories with no numerical value."},
{t:"analysis",q:"“Time in seconds to save a data file” is which type of data?",o:["Ratio","Interval","Ordinal","Nominal"],a:0,e:"Ratio data has equal intervals AND a true zero."},
{t:"analysis",q:"Counting how often the word “trust” appears in interview transcripts is:",o:["Quantitative analysis applied to qualitative data","Purely qualitative analysis","Not allowed in research","Meta-analysis"],a:0,e:"Words are qualitative data, but counting them is a quantitative technique."},
{t:"analysis",q:"Which is a disadvantage of qualitative data analysis (Oates)?",o:["Interpretation is tied to the researcher, so conclusions are more tentative","It cannot handle words or images","It always requires SPSS","It produces only one correct explanation"],a:0,e:"Also: the volume of data can be overwhelming. Its advantage is richness and alternative, equally valid explanations."},
{t:"analysis",q:"Analysing data with no preconceived theory, letting concepts emerge from the data, is:",o:["Grounded theory","Deductive analysis","Meta-analysis","Hypothesis testing"],a:0,e:"The slides note you can analyse data in its own terms (grounded theory) instead of using a framework."},
{t:"analysis",q:"In SLR Step 7 (Boland), a DEDUCTIVE synthesis means you:",o:["Start with a framework (e.g. TOE) and map your codes to its components","Start with no framework and let themes emerge","Only count publications per year","Skip data extraction"],a:0,e:"Inductive: no framework, you name your own themes and relationships."},
{t:"analysis",q:"In the TOE example from class, the code “competitive pressure” belongs to which component?",o:["Environmental","Technological","Organisational","Individual"],a:0,e:"Environmental: competitive pressure, industry trends, customer expectations, external support."},
{t:"slr",q:"In PRISMA, the stage where full-text articles are assessed in detail and reasons for exclusion are documented is:",o:["Eligibility","Identification","Screening","Included"],a:0,e:"Identification → Screening (titles/abstracts) → Eligibility (full text, reasons) → Included."},
{t:"slr",q:"Your Assignment 1 assessed 130 full-text records and excluded 97. How many studies were included?",o:["33","97","130","22"],a:0,e:"130 − 97 = 33 (13 ACM, 17 ScienceDirect, 1 ERIC, 2 reference tracing)."},
{t:"slr",q:"Why did your SLR use SPIDER rather than PICO?",o:["SPIDER suits qualitative and mixed-methods reviews; PICO is mainly clinical/quantitative","PICO is only for engineering","SPIDER is required by PRISMA","PICO cannot produce search terms"],a:0,e:"SPIDER = Sample, Phenomenon of Interest, Design, Evaluation, Research type."},
{t:"slr",q:"SALSA stands for:",o:["Search, Appraisal, Synthesis, Analysis","Sample, Assessment, Selection, Abstract","Scope, Analysis, Literature, Summary","Search, Abstract, Screening, Appraisal"],a:0,e:"SALSA (Grant and Booth, 2009) structures the review process."},
{t:"slr",q:"Reviewing the reference list of a key paper to find older relevant studies is:",o:["Backward citation chaining","Forward citation chaining","Hand searching a database","A scoping review"],a:0,e:"Forward chaining finds newer works that cite the known study."},
{t:"slr",q:"Boland’s Step 2 of the systematic review process is:",o:["Performing scoping searches, defining the review question and inclusion/exclusion criteria (and writing the protocol)","Data extraction and quality assessment","Screening titles and abstracts","Writing up and disseminating"],a:0,e:"1 Plan · 2 Scoping/question/criteria · 3 Search · 4 Screen titles & abstracts · 5 Obtain papers · 6 Select full texts · 7 Theoretical standpoint & synthesis plan · 8 Extraction, presentation, quality · 9 Analysis & synthesis · 10 Write up."},
{t:"slr",q:"A quality appraisal tool that handles quantitative, qualitative and mixed designs in one framework (used in your Assignment 1) is:",o:["MMAT","Cochrane Risk of Bias","AMSTAR","PRISMA"],a:0,e:"MMAT (Hong et al., 2018). PRISMA is a reporting standard, not an appraisal tool."},
{t:"slr",q:"Meta-analysis differs from narrative synthesis because it:",o:["Pools results statistically","Integrates findings descriptively","Is used for qualitative studies","Does not need inclusion criteria"],a:0,e:"Narrative synthesis suits heterogeneous studies."},
{t:"slr",q:"In a search string, synonyms within one concept block are combined with:",o:["OR","AND","NOT","Quotation marks"],a:0,e:"OR within a block; AND between blocks; quotes for exact phrases."},
{t:"slr",q:"Your pilot search returns far too few results. The slide’s advice is to:",o:["Remove one concept block","Add another AND block","Add more date limits","Switch from OR to AND inside blocks"],a:0,e:"Too many → add constraints. Too few → remove a block."},
{t:"slr",q:"A “gold set” in search strategy development is:",o:["Known relevant studies used to test and validate the search","The final included studies","The highest-quality studies after appraisal","A list of journals with high impact factors"],a:0,e:"If your string misses gold-set papers, it needs refining."},
{t:"slr",q:"Boland describes integrative synthesis (e.g. framework synthesis) as taking which approach?",o:["Deductive: concepts are defined up front","Inductive: concepts emerge","Purely statistical","Random"],a:0,e:"Interpretative synthesis (e.g. meta-ethnography, grounded theory) is inductive."},
{t:"slr",q:"The search-string quality criterion “replicable” means:",o:["Others running it get the same results","It captures all synonyms","It minimises noise","Each term is explained"],a:0,e:"Transparent, replicable, comprehensive, precise, justifiable."},
{t:"thematic",q:"Thematic analysis moves from:",o:["Text → codes → categories → themes","Themes → codes → text → categories","Categories → text → themes → codes","Codes → text → themes → categories"],a:0,e:"Codes are tags; categories group codes; themes are higher-level patterns."},

{t:"abstract",q:"Write a structured abstract (120–200 words) for your Assignment 1 SLR on recommender systems and user autonomy, plus keywords.",
 model:"Recommender systems on social media and e-commerce platforms increasingly shape what users see, yet evidence on how they affect autonomy is fragmented. This systematic review examines the mechanisms through which recommender systems influence user decision-making, how users respond, and how well existing theory explains this. Following PRISMA 2020, ACM Digital Library, ScienceDirect and ERIC were searched; 33 studies (2021–2026) were appraised with MMAT and synthesised thematically. Findings show that persuasive interface design, preference capture and attention engineering combine into an “Autonomy Illusion”, while awareness of algorithms rarely produces lasting resistance (the “Awareness Paradox”). The review is limited to English studies. It contributes a structural account of autonomy erosion and argues that platform design and regulation, not literacy alone, must protect user agency.\n\nKeywords: recommender systems; user autonomy; hypernudging; algorithmic literacy; systematic literature review",
 check:[["Context/problem stated briefly",["fragment","yet","gap","increasingly","despite"]],["Purpose/aim stated",["examine","aim","purpose","investigat"]],["Method: SLR, PRISMA, databases and number of studies",["prisma","systematic","33","database"]],["Main findings (mechanisms / Autonomy Illusion / Awareness Paradox)",["illusion","paradox","mechanism","finding"]],["Originality/value or implications, plus keywords",["contribut","value","implication","keyword"]]]},
{t:"conclusion",q:"Write the Conclusion paragraph for your SLR, following your Assignment 1 feedback (“start with what you have done, then answer the so what”).",
 model:"This review set out to explain how recommender systems on social media and e-commerce platforms affect user autonomy. Synthesising 33 studies, it found that persuasive interface design, preference capture and attention engineering together create an Autonomy Illusion, and that user awareness rarely becomes sustained resistance. So what? Autonomy erosion is structural, built into engagement-driven platform design, rather than a failure of individual users. Theoretically, this extends Yeung’s hypernudging with normative criteria; practically, it points designers and regulators to exit affordances and controllable interfaces. Future research should test the model empirically across platforms, as the gaps in Section 4.3 show.",
 check:[["Restates what was done (aim/problem and SLR)",["set out","aim","this review","this study","examined"]],["Summarises main findings concisely",["found","finding","illusion","paradox","mechanism"]],["Answers “so what”: contribution to theory",["theor","extend","contribut","so what"]],["States practical/policy implications",["design","regulat","polic","practic"]],["Future research linked to identified gaps; no new literature",["future","further research","gap"]]]},
{t:"synthesis",q:"Rewrite this author-centric paragraph as synthesised writing.",
 ctx:"Huang and Liu (2025) found that algorithm awareness leads to reflective acceptance. Sotero, Vicente and Granado (2026) found that algorithmic literacy did not change interaction outcomes. Craig (2025) found that users who were aware and fatigued became resigned.",

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function spread(pool,n){const by={};shuffle(pool).forEach(x=>(by[x.t]=by[x.t]||[]).push(x));const keys=shuffle(Object.keys(by));const out=[];while(out.length<n&&keys.some(k=>by[k].length)){for(const k of keys){if(by[k].length&&out.length<n)out.push(by[k].pop())}}return out}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let S=null; // current session
let tab="mock";

function makeItem(kind,src,idx){
  const id=kind+idx+"_"+Math.random().toString(36).slice(2,7);
  if(kind==="mcq"){const order=shuffle(src.o.map((_,i)=>i));return {id,kind,t:src.t,src,order,marks:1}}
  if(kind==="tf")return {id,kind,t:src.t,src,marks:1};
  if(kind==="match"){const letters="ABCDE";const right=shuffle(src.pairs.map(p=>p[1]));return {id,kind,t:src.t,src,right,letters,marks:src.pairs.length}}
  return {id,kind:"short",t:src.t,src,marks:5};
}
function newSession(mode,items,minutes){
  S={mode,items,ans:{},rev:{},self:{},submitted:false,endAt:minutes?Date.now()+minutes*60000:null,confirm:false};
  clearInterval(window._tick);
  if(minutes){window._tick=setInterval(tick,500)}
}

/* ---------- SCORING ---------- */
function itemScore(it){
  const a=S.ans[it.id];
  if(it.kind==="mcq")return a===it.src.a?1:0;
  if(it.kind==="tf")return a===it.src.a?1:0;
  if(it.kind==="match"){let s=0;it.src.pairs.forEach((p,i)=>{if(a&&a[i]===p[1])s++});return s}
  const ticks=S.self[it.id]||[];return ticks.filter(Boolean).length;
}
function isAnswered(it){const a=S.ans[it.id];if(it.kind==="match")return a&&Object.keys(a).length>0;if(it.kind==="short")return !!(a&&a.trim());return a!==undefined}
function suggestTicks(it){const txt=(S.ans[it.id]||"").toLowerCase();return it.src.check.map(c=>txt.length>15&&c[1].some(k=>txt.includes(k.toLowerCase())))}

/* ---------- RENDER: ITEMS ---------- */
function itemHTML(it,n){
  const rev=S.rev[it.id], src=it.src, a=S.ans[it.id];
  let body="", fb="";
  if(it.kind==="mcq"){
    body=`<div class="qt">${esc(src.q)}<br><span class="tag">${TOPICS[it.t]}</span></div><div class="qb"><div class="opts">`+
      it.order.map((oi,k)=>{let cls="";if(rev){if(oi===src.a)cls="right";else if(a===oi)cls="wrong"}
        return `<label class="opt ${cls}"><input type="radio" name="${it.id}" data-id="${it.id}" data-v="${oi}" ${a===oi?"checked":""} ${rev?"disabled":""}><span><b class="mono">${"abcd"[k]}</b>&nbsp; ${esc(src.o[oi])}</span></label>`}).join("")+`</div>`;
    if(rev){const ok=a===src.a;fb=`<div class="fb ${ok?"good":"bad"}"><b class="v">${ok?"Correct":a===undefined?"Not answered":"Incorrect"}</b>${esc(src.e)}</div>`}
  } else if(it.kind==="tf"){
    body=`<div class="qt">${esc(src.s)}<br><span class="tag">${TOPICS[it.t]}</span></div><div class="qb"><div class="opts tf">`+
      [true,false].map(v=>{let cls="";if(rev){if(v===src.a)cls="right";else if(a===v)cls="wrong"}
        return `<label class="opt ${cls}"><input type="radio" name="${it.id}" data-id="${it.id}" data-tf="${v}" ${a===v?"checked":""} ${rev?"disabled":""}><span>${v?"True":"False"}</span></label>`}).join("")+`</div>`;
    if(rev){const ok=a===src.a;fb=`<div class="fb ${ok?"good":"bad"}"><b class="v">${ok?"Correct":a===undefined?"Not answered":"Incorrect"} — the statement is ${src.a?"true":"false"}.</b>${esc(src.e)}</div>`}
  } else if(it.kind==="match"){
    const aa=a||{};
    body=`<div class="qt">${esc(src.title)} <span class="muted">(1 mark each)</span><br><span class="tag">${TOPICS[it.t]}</span></div><div class="qb"><div class="scroll"><table class="mt">`+
      src.pairs.map((p,i)=>{let cls="";if(rev)cls=aa[i]===p[1]?"right":"wrong";
        return `<tr class="${cls}"><td>${esc(p[0])}</td><td><select data-id="${it.id}" data-row="${i}" ${rev?"disabled":""} aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${it.right.map(r=>`<option ${aa[i]===r?"selected":""}>${esc(r)}</option>`).join("")}</select>${rev&&aa[i]!==p[1]?`<div class="fix">✓ ${esc(p[1])}</div>`:""}</td></tr>`}).join("")+`</table></div>`;
    if(rev){const s=itemScore(it);fb=`<div class="fb ${s===src.pairs.length?"good":"bad"}"><b class="v">${s} / ${src.pairs.length} matched correctly</b></div>`}
  } else {
    const txt=a||"";const wc=txt.trim()?txt.trim().split(/\s+/).length:0;
    body=`<div class="qt">${esc(src.q)}<br><span class="tag">${TOPICS[it.t]}</span></div><div class="qb">${src.ctx?`<div class="ctx">${esc(src.ctx).replace(/\n/g,"<br>")}</div>`:""}
      <textarea id="ta_${it.id}" data-id="${it.id}" ${rev?"readonly":""} placeholder="Write your answer as you would in the test…">${esc(txt)}</textarea><div class="wc">${wc} words</div>`;
    if(rev){
      if(!S.self[it.id])S.self[it.id]=suggestTicks(it);
      const sug=suggestTicks(it), ticks=S.self[it.id];
      fb=`<div class="fb"><span class="label">Model answer</span><div class="model">${esc(src.model)}</div>
        <div style="margin-top:12px"><span class="label">Mark yourself: tick each point your answer covers</span></div>
        <div class="check">${src.check.map((c,i)=>`<label><input type="checkbox" data-self="${it.id}" data-i="${i}" ${ticks[i]?"checked":""}><span>${esc(c[0])}${sug[i]?'<span class="sug">keyword found</span>':""}</span></label>`).join("")}</div>
        <div class="selfmark">Your mark: <span class="hl">${itemScore(it)} / 5</span></div></div>`;
    }
  }
  const checkBtn=(S.mode==="practice"&&!rev)?`<div style="margin-top:10px"><button class="btn sm alt" data-check="${it.id}">Check answer</button></div>`:"";
  const cut=body.indexOf('<div class="qb">');
  const qt=body.slice(0,cut), qb=body.slice(cut+16);
  return `<div class="q" id="q_${it.id}"><div class="qn">${n}.</div>${qt}<div class="qm">[${it.marks}]</div><div class="qb">${qb}${fb}${checkBtn}</div></div>`;
}
/* simpler: build wrapper explicitly */
function card(it,n){
  const inner=itemHTML(it,n);return inner;
}

function render(){

      <div class="row"><button class="btn acc" id="startMock">Start the 60-minute test</button><button class="btn alt" id="startUntimed">Start without a timer</button></div>

  let html="",n=0,last="";

    html+=`<div class="section-h"><h2>Section ${secs[it.kind][0]}: ${secs[it.kind][1]}</h2><span class="mono muted">[${m} marks]</span></div><div>`}

function handinHTML(){
  const un=S.items.filter(it=>!isAnswered(it)).length;
  if(!S.confirm)return `<button class="btn acc" id="submitBtn">Hand in paper</button>`;
  return `<div class="confirm"><b>Hand in now?</b> ${un?`You have ${un} unanswered question${un>1?"s":""}.`:"All questions answered."} You can’t change answers afterwards.<div class="row" style="margin-top:10px"><button class="btn acc" id="confirmYes">Yes, hand in</button><button class="btn alt" id="confirmNo">Keep writing</button></div></div>`;
}
function topicBreakdown(){
  const t={};S.items.forEach(it=>{t[it.t]=t[it.t]||[0,0];t[it.t][0]+=itemScore(it);t[it.t][1]+=it.marks});return t;
}
function resultsHTML(){
  const tot=S.items.reduce((s,it)=>s+itemScore(it),0),max=S.items.reduce((s,it)=>s+it.marks,0),pct=Math.round(tot/max*100);
  const tb=topicBreakdown();
  const rows=Object.entries(tb).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[e,m]])=>{const p=e/m;const col=p>=.75?"var(--good)":p>=.5?"var(--warn)":"var(--bad)";
    return `<div class="tb"><span class="t">${TOPICS[k]}</span><span class="tr"><i style="width:${Math.max(3,p*100)}%;background:${col}"></i></span><span class="n">${e}/${m}</span></div>`}).join("");
  const weak=Object.entries(tb).filter(([k,[e,m]])=>e/m<.6).map(([k])=>TOPICS[k]);
  return `<div class="sheet" style="margin-bottom:16px"><div class="score"><div class="big">${tot}<small> / ${max}</small></div>
    <div><span class="label">Result · ${pct}%</span><p style="margin:4px 0 0">${pct>=75?"Strong paper.":pct>=50?"A pass, with room to sharpen.":"Below 50%: revise the weak topics below, then try another paper."} ${weak.length?`Focus next on: <b>${weak.join(", ")}</b>.`:""} Section D marks update as you tick the checklists below.</p></div></div>
    <div class="tbars">${rows}</div></div>`;
}

function countPractice(){

}

  if(!h.length){app.innerHTML=`<div class="sheet stack"><span class="label">History</span><h1>No mock tests yet</h1><p class="muted" style="margin:0">After you hand in a mock test, your score and topic breakdown appear here so you can see which topics improve.</p><div><button class="btn acc" id="goMock">Start a mock test</button></div></div>`;return}
  const agg={};h.forEach(r=>Object.entries(r.byTopic).forEach(([k,[e,m]])=>{agg[k]=agg[k]||[0,0];agg[k][0]+=e;agg[k][1]+=m}));
  const rows=Object.entries(agg).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[e,m]])=>{const p=e/m;const col=p>=.75?"var(--good)":p>=.5?"var(--warn)":"var(--bad)";return `<div class="tb"><span class="t">${TOPICS[k]}</span><span class="tr"><i style="width:${Math.max(3,p*100)}%;background:${col}"></i></span><span class="n">${Math.round(p*100)}%</span></div>`}).join("");
  app.innerHTML=`<div class="sheet stack"><span class="label">History</span><h1>Your mock test record</h1>
    <div class="scroll"><table class="hist"><thead><tr><th>Date</th><th>Score</th><th>%</th><th>Time used</th></tr></thead><tbody>${h.slice().reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td class="n">${r.score}/${r.max}</td><td class="n">${Math.round(r.score/r.max*100)}%</td><td class="n">${r.used||"—"}</td></tr>`).join("")}</tbody></table></div>
    <div><span class="label">All attempts by topic, weakest first</span><div class="tbars">${rows}</div></div>
    <div class="row"><button class="btn alt sm" id="clearHist">Clear history</button></div></div>`;
}

/* ---------- ACTIONS ---------- */
function buildMock(timed){
  const items=[...spread(MCQ,20).map((s,i)=>makeItem("mcq",s,i)),...spread(TF,10).map((s,i)=>makeItem("tf",s,i)),...spread(MATCH,2).map((s,i)=>makeItem("match",s,i)),...spread(SHORT,4).map((s,i)=>makeItem("short",s,i))];
  newSession("mock",items,timed?60:0);S.startedAt=Date.now();render();window.scrollTo(0,0);
}
function submitMock(){
  S.submitted=true;S.items.forEach(it=>S.rev[it.id]=true);clearInterval(window._tick);
  S.items.filter(i=>i.kind==="short").forEach(it=>S.self[it.id]=suggestTicks(it));
  const used=Math.round((Date.now()-S.startedAt)/60000)+" min";
  const h=store.get("history",[]);S.histIndex=h.length;
  h.push({date:Date.now(),score:S.items.reduce((s,it)=>s+itemScore(it),0),max:60,byTopic:topicBreakdown(),used});store.set("history",h);
  render();window.scrollTo(0,0);
}
function saveHistoryUpdate(){
  if(S&&S.mode==="mock"&&S.submitted&&S.histIndex!==undefined){const h=store.get("history",[]);if(h[S.histIndex]){h[S.histIndex].score=S.items.reduce((s,it)=>s+itemScore(it),0);h[S.histIndex].byTopic=topicBreakdown();store.set("history",h)}}
}
function rerenderItem(it){
  const el=document.getElementById("q_"+it.id);if(!el)return;const n=el.querySelector(".qn").textContent.replace(".","");
  el.outerHTML=card(it,n);
}
function tick(){
  if(!S||!S.endAt||S.submitted)return;
  const left=Math.max(0,S.endAt-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  const t=$("#timer");if(t){t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",left<5*60000)}
  if(left<=0){submitMock()}
}
function updateBar(){
  if(!S||S.mode!=="mock")return;const n=S.items.filter(isAnswered).length;
  $("#answered").textContent=n+" / "+S.items.length+" answered";$("#progi").style.width=(n/S.items.length*100)+"%";
  if(!S.endAt)$("#timer").textContent="Untimed";else tick();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  const id=b.id;
  if(id==="startMock")buildMock(true);
  else if(id==="startUntimed")buildMock(false);
  else if(id==="submitBtn"||id==="submitTop"){if(tab!=="mock"){tab="mock";render()}S.confirm=true;const h=$("#handin");if(h){h.innerHTML=handinHTML();h.scrollIntoView({behavior:"smooth",block:"center"})}}
  else if(id==="confirmYes")submitMock();
  else if(id==="confirmNo"){S.confirm=false;$("#handin").innerHTML=handinHTML()}
  else if(id==="again"){S=null;render();window.scrollTo(0,0)}
  else if(id==="goMock"){tab="mock";render()}
  else if(id==="clearHist"){if(b.dataset.armed){store.set("history",[]);render()}else{b.dataset.armed="1";b.textContent="Click again to clear"}}
  else if(b.dataset.topic||b.dataset.type){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");countPractice()}
  else if(id==="allT"||id==="noneT"){document.querySelectorAll("#topicChips .chip").forEach(c=>c.setAttribute("aria-pressed",id==="allT"?"true":"false"));countPractice()}
  else if(id==="startPractice"){const {tps,tys,n}=countPractice();if(!n){$("#pcount").textContent="Pick at least one topic and type.";return}
    const f=x=>tps.includes(x.t);const items=[];
    if(tys.includes("mcq"))shuffle(MCQ.filter(f)).forEach((s,i)=>items.push(makeItem("mcq",s,i)));
    if(tys.includes("tf"))shuffle(TF.filter(f)).forEach((s,i)=>items.push(makeItem("tf",s,i)));
    if(tys.includes("match"))shuffle(MATCH.filter(f)).forEach((s,i)=>items.push(makeItem("match",s,i)));
    if(tys.includes("short"))shuffle(SHORT.filter(f)).forEach((s,i)=>items.push(makeItem("short",s,i)));
    newSession("practice",shuffle(items),0);render();window.scrollTo(0,0)}
  else if(id==="newPractice"){S=null;render()}
  else if(b.dataset.check){const it=S.items.find(x=>x.id===b.dataset.check);S.rev[it.id]=true;rerenderItem(it);
    const h=document.querySelector(".sheet h2");if(h){const done=S.items.filter(x=>S.rev[x.id]),got=done.reduce((s,x)=>s+itemScore(x),0),mx=done.reduce((s,x)=>s+x.marks,0);h.innerHTML=`${done.length} of ${S.items.length} checked · <span class="hl">${got}/${mx}</span>`}}
});
document.addEventListener("change",e=>{
  const el=e.target;if(!S)return;
  if(el.dataset.self){const it=S.items.find(x=>x.id===el.dataset.self);S.self[it.id][+el.dataset.i]=el.checked;
    const sm=document.querySelector("#q_"+CSS.escape(it.id)+" .selfmark");if(sm)sm.innerHTML=`Your mark: <span class="hl">${itemScore(it)} / 5</span>`;
    if(S.mode==="mock"){saveHistoryUpdate();const r=document.querySelector("#app > .sheet");if(r&&S.submitted){const tmp=document.createElement("div");tmp.innerHTML=resultsHTML();r.replaceWith(tmp.firstElementChild)}}
    else{const h=document.querySelector(".sheet h2");if(h){const done=S.items.filter(x=>S.rev[x.id]),got=done.reduce((s,x)=>s+itemScore(x),0),mx=done.reduce((s,x)=>s+x.marks,0);h.innerHTML=`${done.length} of ${S.items.length} checked · <span class="hl">${got}/${mx}</span>`}}
    return}
  const id=el.dataset.id;if(!id)return;
  if(el.dataset.v!==undefined)S.ans[id]=+el.dataset.v;
  else if(el.dataset.tf!==undefined)S.ans[id]=el.dataset.tf==="true";
  else if(el.dataset.row!==undefined){S.ans[id]=S.ans[id]||{};if(el.value)S.ans[id][+el.dataset.row]=el.value;else delete S.ans[id][+el.dataset.row]}
  updateBar();
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="cribNotes"){store.set("crib_notes",el.value);return}
  if(el.tagName==="TEXTAREA"&&el.dataset.id&&S){S.ans[el.dataset.id]=el.value;const wc=el.nextElementSibling;if(wc){const t=el.value.trim();wc.textContent=(t?t.split(/\s+/).length:0)+" words"}updateBar()}
});
render();
</script>

</body>
</html>
